[package]
name = "mikupush-server"
version = "0.0.20"
edition = "2024"

[dependencies]
actix-web = "4.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
futures = "0.3.33"
diesel = { version = "2.3.11", features = ["postgres", "r2d2", "uuid", "chrono"] }
pq-sys = { version = "0.7.5", features = ["bundled"] }
diesel_migrations = "2.3.2"
r2d2 = "0.8.10"
dirs = "6.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
dotenvy = "0.15.7"
serial_test = "3.5.0"
actix-files = "0.6.10"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-actix-web = "0.7.22"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
clap = { version = "4.5", features = ["derive"] }
tokio-util = "0.7.19"
actix-http = "3.11.2"
bytes = "1.12.1"
tokio-stream = "0.1.19"
rusqlite = { version = "0.40.0", features = ["bundled"] }
accept-language = "3.1.0"
reqwest = { version = "0.13.4", features = ["blocking"] }
moka = { version = "0.12.15", features = ["future", "sync"] }
log = "0.4.33"
